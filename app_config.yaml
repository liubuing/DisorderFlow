alphafold:
  af2:
    executable: colabfold_batch
    venv: ../venv
  defaults:
    calc_extra_ptm: false
    model_type: auto
    num_models: 1
    num_recycle: 1
    rank: auto
    stop_at_score: 85
    use_amber: false
    use_dropout: false
  output_dir: alphafold_results
batch:
  max_workers: 2
  output_dir: batch_results
  save_individual: true
  save_summary: true
  summary_format: csv
  timeout_per_job: 300
bfn_defaults:
  antibody:
    cdrs:
    - H_CDR1
    - H_CDR2
    - H_CDR3
    - L_CDR1
    - L_CDR2
    - L_CDR3
    eval_mode: true
    heavy_chain: H
    light_chain: L
    num_samples: 3
    stochastic: false
  protein:
    eval_mode: true
    num_samples: 3
    region: A:10-25
    stochastic: false
closed_loop:
  defaults:
    convergence_delta: 0.02
    convergence_patience: 2
    design_tool: "BFN (\u6297\u4F53CDR\u8BBE\u8BA1)"
    max_cycles: 5
    n_samples: 20
    top_k: 5
  finetune:
    batch_size: 4
    enabled: false
    freeze_backbone: true
    frequency: 2
    lr: 1.0e-05
    n_epochs: 3
  multi_objective:
    thresholds:
      dG_max: 5.0
      ddG_max: 10.0
      entropy_max: 2.8
      iptm_min: 0.25
      max_pae_max: 20.0
      plddt_min: 50.0
      ppl_max: 200.0
      ptm_min: 0.25
    weights:
      contacts: 0.05
      dG: 0.15
      ddG: 0.05
      entropy_inv: 0.05
      iptm: 0.25
      max_pae: 0.05
      plddt: 0.15
      ppl_inv: 0.1
      ptm: 0.1
      recovery: 0.05
      relax_e: 0.05
  output:
    dir: closed_loop_results
    save_cycles: true
    save_pareto_plots: true
  physics:
    antibody_chains: HL
    antigen_chain: A
    enable_relax: false
    relax_max_iter: 200
    scorefxn: ref2015
  ranking:
    hybrid_ratio: 0.5
    strategy: pareto_first
confidence:
  iptm_high: 0.7
  iptm_medium: 0.4
  pae_low: 4.0
  pae_medium: 8.0
  plddt_high: 0.8
  plddt_medium: 0.6
esmif_defaults:
  chain: A
  num_samples: 3
  temperature: 0.1
misfolding_disease:
  cascade:
    thresholds:
      entropy_max: 2.8
      iptm_min: 0.25
      ppl_max: 200.0
    weights:
      entropy_inv: 0.1
      iptm: 0.45
      plddt: 0.15
      ppl_inv: 0.15
      recovery: 0.15
  defaults:
    af2_recycle: 3
    constraint_cutoff: 8.0
    design_samples: 10
    design_tool: "BFN (\u901A\u7528\u86CB\u767D\u8BBE\u8BA1)"
    max_refinement_rounds: 3
    model_type: alphafold2_multimer_v3
    top_k_iterative: 3
  idp:
    disorder_predictor_status: unsupported
    external_profile_mode: exploratory_whole_cdr_temperature
    external_profile_routing:
      final_holdout_status: sealed_not_evaluated
      production_checkpoint_replacement: false
      production_status: rejected_development_gates
      reason: position-specific factual advantage did not generalize on project development
    external_sequence_predictor:
      accepted_interface: versioned_per_residue_sequence_profile
      cache_required: true
      device: cpu
      fallback_to_model_disorder_head: false
      implementation: metapredict
      invalid_sequence_action: fail
      model_version: V3
      normalized: true
      package_version: 3.0.2
      provenance_required: true
      status: configured_offline
    min_plddt_for_idp: 0.4
    require_af2_validation: true
    warn_on_design: true
  output_dir: misfolding_results
  targets_dir: data/misfolding_targets
models:
  bfn:
    checkpoint: logs/pretrained/best.pt
    config: configs/demo_design.yml
  esmif:
    model_name: esm_if1_gvp4_t16_142M_UR50
  proteinmpnn:
    ca_weights_dir: ProteinMPNN/ca_model_weights
    model_name: v_48_020
    soluble_weights_dir: ProteinMPNN/soluble_model_weights
    weights_dir: ProteinMPNN/vanilla_model_weights
mpnn_defaults:
  ca_only: false
  chains: A
  num_samples: 3
  omit_aas: ''
  seed: 42
  temperature: '0.1'
  use_soluble: false
server:
  auto_open: true
  host: 127.0.0.1
  port: 7860
  reload: false
  share: false
target_design:
  contact:
    interface_cutoff: 8.0
    strict_contact_cutoff: 5.0
  defaults:
    constraint_mode: true
    design_tool: "BFN (\u6297\u4F53CDR\u8BBE\u8BA1)"
    top_n_epitopes: 20
  design:
    default_constraint_cutoff: 10.0
  epitope:
    hydrophilicity_weight: 0.35
    min_rel_sasa: 0.15
    protrusion_weight: 0.25
    sasa_weight: 0.4
workflow:
  af2_validation:
    enabled: false
    max_sequences: 5
    num_recycle: 1
  cascade:
    thresholds:
      entropy_max: 2.5
      iptm_min: 0.4
      plddt_min: 0.6
      ppl_max: 100.0
    weights:
      entropy_inv: 0.1
      iptm: 0.35
      plddt: 0.25
      ppl_inv: 0.15
      recovery: 0.15
