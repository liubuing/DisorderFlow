# Single source of truth for numbers that appear in more than one document.
#
# Rules
# - Every value below must be traceable to a frozen artifact or a frozen
#   decision record. If a value is development-level, say so in `status`.
# - Documents may quote these values, but must not invent alternatives.
# - `stale_values` lists numbers that were published once and later voided.
#   Any document that still contains one of them must also carry one of the
#   allowed markers, or `scripts/audit_doc_consistency.py` reports it.
# - Frozen artifacts are never edited to match prose. Prose is corrected to
#   match frozen artifacts, with a disclosure when the correction changes a
#   claim.

schema_version: 1
updated: "2026-11-11"
maintainer_note: >
  This registry is intentionally conservative. Where a number exists only in a
  development report and not in a frozen JSON, the source is marked as a report
  and the status is development. Do not promote such a value to a confirmatory
  claim without a new preregistration.

