# Values that were published once and later voided. Documents must either omit
# them or carry an allowed marker near the hit.
stale_values:
  - id: flex_j0a_pre_fix
    values: ["0.12419", "0.124"]
    context_required: "(?i)(flex|j0a|advantage)"
    reason: chain-role encoding bug (fragment_type keyed on chain index)
    replacement: flex_j0a_v2.canonical.mean_advantage
  - id: flex_j0b_pre_fix
    values: ["0.14094", "0.141"]
    context_required: "(?i)(flex|j0b|advantage)"
    reason: same chain-role encoding bug
    replacement: flex_j0b_v2.canonical.mean_advantage
  - id: flex_c1_pre_fix
    values: ["0.767", "0/26"]
    context_required: "(?i)(flex|c1|native|percentile)"
    reason: same chain-role encoding bug; percentile polarity also inverted
    replacement: flex_c1_v2.canonical.judge_mean_percentile
  - id: flex_c1_never_top5
    values: ["never top-5", "never in the top 5", "never top 5"]
    reason: >
      The frozen top1_rate/top5_rate fields counted "never last", not "never
      first". Reconstruction from frozen scores found 9/26 pools in the top 5
      before the encoding fix; after the fix the native is top-1 in 26/26.
    replacement: flex_c1_v2.canonical.judge_top5_rate
  - id: composition_ci_point_mismatch
    values: ["0.544 ([0.545, 0.630])", "0.54399", "[0.54496, 0.63025]"]
    reason: >
      Point estimate is component-equal; bootstrap is family-clustered. Quote
      both: 0.544 component-equal, 0.584 family-equal.
    replacement: flex_c1_v2.canonical.composition_mean_percentile
  - id: ecls_old_title
    values: ["native recognition and the limits of candidate ranking"]
    reason: title revised 2026-11-09 to a bounded claim
    replacement: "Peptide-context scoring of antibody loops: native recognition is not candidate ranking"
  - id: app_py_line_count
    values: ["65-line launcher", "65 line launcher"]
    reason: app.py is 73 lines after the webapp split
    replacement: "73-line launcher"

allowed_markers:
  - SUPERSEDED
  - superseded
  - VOID
  - void
  - 作废
  - 修复前
  - bug 修复前
  - chain-role encoding bug
  - correction
  - pre-fix
  - historical
  - 过程记录
  - do not cite
  - 不得引用
  - legacy
  - provenance
