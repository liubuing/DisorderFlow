    reliability: reliable
    provenance_verified: true
    rcsb_title: Crystal structure of Crenezumab Fab in complex with Abeta

negative_states:
  mode: synthetic_perturbation
  heldout_seed_offset: 10000

candidate_generation:
  engine: contact_guided
  samples_per_ref: 150
  v4_samples_per_ref: 150
  max_mutations: 4

statecontrast:
  seeds: [31, 41, 51, 61, 71]
  rule_mode: position
  validation_mode: leave_reference_out
  min_support: 4
  min_effect: 0.004
  min_recurrence: 2
  required_controls:
    - parent_only
    - random_position
    - shuffled_position
    - heldout_negative_states
    - multi_seed_replicates
    - leave_one_reference_out

claim_gate:
  has_real_negative_ensembles: false
  has_wetlab: false
  minimum_references: 4

fold_sidecheck:
  enabled: false
  mode: optional_colabfold
