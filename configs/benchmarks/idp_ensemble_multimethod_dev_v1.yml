methods:
  proposed:
    id: contact_ensemble_robust
    role: development_proxy_for_future_ensemble_aware_bfn
    implementation: contact-guided candidate generation and robust multi-conformer selection
    availability: complete_on_6_components
  baselines:
    - id: contact_single_state
      availability: complete_on_4_abeta_components
    - id: native
      availability: complete_on_6_components
    - id: composition_matched_random
      availability: complete_on_4_abeta_components
    - id: single_conformer_bfn
      availability: unavailable_matched_six_component_arm
    - id: proteinmpnn
      availability: unavailable_matched_six_component_arm
    - id: esm_if
      availability: unavailable_matched_six_component_arm

generation_contract_for_new_arms:
  mutable_region: heavy_chain_h3_only
  seeds: [4101, 4111, 4121]
  candidates_per_seed: 8
  temperature: 0.5
  same_input_pose_and_mutable_positions_per_component: true
  failures_remain_failures: true

primary:
  contrast: contact_ensemble_robust_minus_contact_single_state
  inference_unit: independent_antibody_reference_component
  within_component_aggregation: mean_across_heldout_conformers
  direction: higher_is_better

statistics:
  bootstrap_trials: 10000
  bootstrap_seed: 8117
  exact_paired_sign_flip: true

gates:
  minimum_valid_components: 12
  minimum_positive_component_fraction: 0.6666666666666666
  require_component_bootstrap_ci95_lower_above_zero: true
  require_complete_matched_arms:
    - single_conformer_bfn
    - proteinmpnn
    - esm_if

output: reviewer_outputs/idp_ensemble_multimethod_dev_v1/analysis.json
claim_boundary: retrospective contact-topology development evidence on computationally transferred antibody poses; no BFN superiority, binding, affinity, specificity, efficacy, or confirmatory claim
