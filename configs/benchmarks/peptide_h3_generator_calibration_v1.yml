    minimum_mean_nnr: 0.95
    minimum_top1_fraction: 0.90
  bfn:
    lambda: 1.0
    source: frozen_ecls_no_generator_specific_adaptation_pool
  esm_if:
    lambda: 1.0
    source: frozen_ecls_no_generator_specific_adaptation_pool
statistics:
  inference_unit: official_antigen_cluster
