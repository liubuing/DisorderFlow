schema_version: 1
status: frozen_before_t2.1_temporal_final_run
purpose: deterministic_torsion_perturbation_recovery_with_random_null_controls
ensemble_class: T2.1_length_adaptive_torsion_perturbation_residue_contact_recovery
split_audit: data/peptide_h3_temporal_split_v3/audit.json
benchmark_split: sealed_final
lmdb: data/peptide_h3_temporal_split_v3/sealed_final.lmdb
inference_axis: official_antigen_cluster
torsion_perturbation:
  rmsd_tier_min_angstrom: 1.5
  rmsd_tier_max_angstrom: 3.0
  rmsd_target_center: 2.25
  maximum_scale_degrees: 60.0
  grid_step_degrees: 2.0
  perturbation_seed_prefix: 1009
chains:
  antibody: [H, L]
  peptide: P
sampling:
  platform: CPU
  ph: 7.4
  pdbfixer_seed: 3527
  friction_per_ps: 1.0
  timestep_fs: 2.0
  minimization_tolerance_kj_mol_nm: 10.0
  minimization_iterations: 300
  snapshot_minimization_iterations: 200
  antibody_heavy_atom_restraint: 5000.0
  peptide_backbone_restraint: 25.0
  contact_definition: original_deposited_CA_pairs
  contact_cutoff_angstrom: 8.0
  supplied_contact_fraction: 0.5
  recovery_contact_upper_bound_nm: 0.8
  recovery_contact_stiffness: 150.0
  recovery_temperature_kelvin: 300.0
  recovery_steps: 2000
  random_restraint_upper_bound_nm: 0.8
  random_restraint_stiffness: 150.0
  null_control_antibody_restraint: 5000.0
  seeds: [3527, 3539, 3557, 3571]
  quality_control:
    max_antibody_rmsd: 0.5
    max_final_peptide_rmsd: 3.5
ensemble_requirements:
  minimum_accepted_replicas: 3
  minimum_acceptance_fraction: 0.75
controls:
  peptide_backbone_restraint_arm: required
  random_restraint_arm: required
  null_structural_arm: required
statistics:
  inference_unit: official_antigen_cluster
  bootstrap_trials: 10000
  bootstrap_seed: 3593
development_gates:
  minimum_valid_cluster_fraction: 0.8
  require_held_out_recovery_ci95_lower_above_zero: true
  minimum_fraction_clusters_positive_held_out_recovery: 0.7
policy:
  temporal_final_access: t2.1_one_time_only
  claim_boundary: deterministic_torsion_perturbation_recovery_with_antibody_aligned_residue_contact_restraints_not_blind_docking
  unseal_justification: >
    The 31 sealed-final structures (15 clusters) were evaluated once under the ECLS hypothesis.
    They have not been used in any T2 torsion perturbation or physical recovery experiment.
    This T2.1 protocol is a new scientific hypothesis distinct from ECLS and from the
    rejected T2 development protocol that used only 7 development clusters. The 15
    temporal-final clusters serve as a held-out physical validation set for the
    deterministic length-adaptive torsion perturbation method, with random-restraint and
    null-structural arms serving as within-run controls.
