schema_version: 1
endpoint_id: endpoint_v3_1
status: v3_1_top_quartile_contract_frozen_after_native_constraint_failure_before_effect_access
classification: exposed_12_component_endpoint_development_not_confirmation

inputs:
  development:
    path: reviewer_outputs/idp_ensemble_ecls_scoring_dev_v1/analysis.json
    sha256: ea40c8e07ed7985a56c13f6a00626485791305effeb2c7749c78fcb840413acf
  expansion:
    path: reviewer_outputs/idp_ensemble_ecls_scoring_expansion_v1/analysis.json
    sha256: ce1ea4ffb61801562ed94a928a46bf5001e65b9c6551a529b12bc99df670916e

methods: [proteinmpnn, single_conformer_bfn, esm_if]
primary_method: proteinmpnn
proteinmpnn_alphabet: ACDEFGHIKLMNPQRSTVWYX
candidate_pool:
  generated_sequences_deduplicated: true
  append_native_once: true
  native_semantics: parent_reference_candidate_without_guaranteed_feasibility

selection:
  outer_protocol: leave_one_conformer_out
  complex_constraint: top_fraction_by_robust_complex_nll
  complex_top_fraction: 0.25
  minimum_feasible_candidates: 4
  constraint_tolerance: 1.0e-12
  feasible_objective: maximize_robust_apo_minus_complex_gain
  tie_break: lexicographically_greatest_sequence
  gain_aggregation:
    p25_weight: 0.45
    minimum_weight: 0.25
    mean_weight: 0.20
    standard_deviation_penalty: 0.10
  complex_cost_aggregation:
    p75_weight: 0.45
    maximum_weight: 0.25
    mean_weight: 0.20
    standard_deviation_penalty: 0.10
  single_state_comparator:
    same_top_fraction_complex_constraint: true
    gain_median: median_of_four_heldout_gain_observations
    complex_median: median_of_four_heldout_complex_nll_observations
    apo_median: median_of_four_heldout_apo_nll_observations
    metric_medians_are_computed_independently: true

statistics:
  inference_unit: independent_antibody_reference_component
  bootstrap_trials: 10000
  bootstrap_seed: 8431
  exact_paired_sign_flip: true
  mathematical_effect_epsilon: 1.0e-9

development_gates_for_future_freeze:
  minimum_valid_components: 12
  minimum_gain_positive_components: 8
  require_gain_bootstrap_ci95_lower_above_zero: true
  maximum_gain_negative_components: 1
  minimum_complex_noninferior_components: 8
  complex_noninferiority_margin: 0.0
  require_complex_bootstrap_ci95_lower_at_or_above_negative_margin: true
  require_full_fold_coverage: true

output:
  json: reviewer_outputs/idp_ensemble_endpoint_v3_1_development_v1/analysis.json
  csv: reviewer_outputs/idp_ensemble_endpoint_v3_1_development_v1/component_method_summary.csv
  report: reviewer_outputs/idp_ensemble_endpoint_v3_1_development_v1/report.md

claim_boundary: one exposed-panel top-quartile complex-filter development iteration after native constraint proved nonselective; no alternative fraction is searched and confirmation requires a new untouched panel
