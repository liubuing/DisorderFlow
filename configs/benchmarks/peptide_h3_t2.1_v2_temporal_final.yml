schema_version: 2
status: frozen_t2.1_v2_with_fixed_params_and_per_structure_analysis
purpose: deterministic_torsion_perturbation_recovery_4_arm_controlled_per_structure
ensemble_class: T2.1_v2_deterministic_torsion_perturbation_residue_contact_recovery
split_audit: data/peptide_h3_temporal_split_v3/audit.json
benchmark_split: sealed_final
lmdb: data/peptide_h3_temporal_split_v3/sealed_final.lmdb
selection_mode: per_structure
torsion_perturbation:
  rmsd_tier_min_angstrom: 1.5
  rmsd_tier_max_angstrom: 3.0
  rmsd_target_center: 2.25
  maximum_scale_degrees: 60.0
  grid_step_degrees: 2.0
  perturbation_seed_prefix: 1009
chains:
  antibody: [H, L]
  peptide: P
sampling:
  platform: CPU
  ph: 7.4
  pdbfixer_seed: 3527
  friction_per_ps: 1.0
  timestep_fs: 2.0
  minimization_tolerance_kj_mol_nm: 10.0
  minimization_iterations: 300
  snapshot_minimization_iterations: 200
  antibody_heavy_atom_restraint: 5000.0
  peptide_backbone_restraint: 100.0
  contact_cutoff_angstrom: 8.0
  supplied_contact_fraction: 0.5
  recovery_contact_upper_bound_nm: 0.8
  recovery_contact_stiffness: 150.0
  recovery_temperature_kelvin: 300.0
  recovery_steps: 2000
  random_restraint_upper_bound_nm: 0.8
  random_restraint_stiffness: 150.0
  null_control_antibody_restraint: 5000.0
  seeds: [3527, 3539, 3557, 3571]
  quality_control:
    max_antibody_rmsd: 0.5
    max_final_peptide_rmsd: 5.0
    relax_geometry_outlier_comparison: true
ensemble_requirements:
  minimum_accepted_replicas: 3
  minimum_acceptance_fraction: 0.75
controls:
  supplied_contacts: primary
  all_contacts: upper_bound
  random_restraints: random_peptide_ca_position_control
  null_structural: antibody_only_baseline
statistics:
  inference_unit: structure
  bootstrap_trials: 10000
  bootstrap_seed: 3593
development_gates:
  minimum_valid_structure_fraction: 0.7
  require_held_out_recovery_ci95_lower_above_zero: true
  minimum_fraction_structures_positive_held_out_recovery: 0.7
policy:
  temporal_final_access: t2.1_v2_one_time_only
  claim_boundary: deterministic_torsion_perturbation_recovery_with_4_arm_controls_per_structure
  parameter_changes_from_v1:
    - peptide_backbone_restraint: 25 -> 100 kJ/mol/nm2
    - max_final_peptide_rmsd: 3.5 -> 5.0 A
    - relax_geometry_outlier_comparison: added (perturbed structures have inherent geometry strain)
    - selection_mode: per_cluster -> per_structure
