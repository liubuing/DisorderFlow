schema_version: 1
endpoint_id: endpoint_v3_extension
status: frozen_v3_contract_applied_to_historical_development_extension
classification: historical_structure_development_extension_not_confirmation

inputs:
  extension:
    path: reviewer_outputs/idp_ensemble_ecls_scoring_extension_v1/analysis.json
    sha256: 3dbdf49b739a734c6f91ca4c407a70a460de23172f0693d18f679fda7ec0ef69

component_registry:
  path: configs/benchmarks/idp_ensemble_development_extension_registry_v1.yml
  sha256: 3409baa3d5f671cadb5cd8f28943f1807f19c699707ab3467bd01fc977a35e8b

methods: [proteinmpnn, single_conformer_bfn, esm_if]
primary_method: proteinmpnn
proteinmpnn_alphabet: ACDEFGHIKLMNPQRSTVWYX
candidate_pool:
  generated_sequences_deduplicated: true
  append_native_once: true
  native_semantics: no_mutation_safety_fallback

selection:
  outer_protocol: leave_one_conformer_out
  complex_constraint: candidate_robust_complex_nll_not_above_native_robust_complex_nll
  constraint_tolerance: 1.0e-12
  feasible_objective: maximize_robust_apo_minus_complex_gain
  tie_break: lexicographically_greatest_sequence
  gain_aggregation:
    p25_weight: 0.45
    minimum_weight: 0.25
    mean_weight: 0.20
    standard_deviation_penalty: 0.10
  complex_cost_aggregation:
    p75_weight: 0.45
    maximum_weight: 0.25
    mean_weight: 0.20
    standard_deviation_penalty: 0.10
  single_state_comparator:
    same_native_complex_constraint: true
    metric_medians_are_computed_independently: true

statistics:
  inference_unit: independent_antibody_reference_component
  bootstrap_trials: 10000
  bootstrap_seed: 8513
  exact_paired_sign_flip: true
  mathematical_effect_epsilon: 1.0e-9
  epitope_cluster_sensitivity_required: true

development_gates_for_future_freeze:
  minimum_valid_components: 12
  minimum_gain_positive_components: 8
  require_gain_bootstrap_ci95_lower_above_zero: true
  maximum_gain_negative_components: 1
  minimum_complex_noninferior_components: 8
  complex_noninferiority_margin: 0.0
  require_complex_bootstrap_ci95_lower_at_or_above_negative_margin: true
  require_full_fold_coverage: true

output:
  json: reviewer_outputs/idp_ensemble_endpoint_v3_extension_v1/analysis.json
  csv: reviewer_outputs/idp_ensemble_endpoint_v3_extension_v1/component_method_summary.csv
  report: reviewer_outputs/idp_ensemble_endpoint_v3_extension_v1/report.md

claim_boundary: unchanged v3 constrained two-axis endpoint on a historical development extension; full, clean-primary, target, and epitope-cluster summaries are development evidence only
