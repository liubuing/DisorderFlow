  contact_auroc_minimum: 0.60
  valid_component_fraction_minimum: 0.80
  sampled_h3_unique_fraction_minimum: 0.50
policy:
  checkpoint_selection_allowed: true
  threshold_tuning_allowed: true
  v2_rerun_allowed: false
  confirmatory_claim_allowed: false
  successor_confirmatory_protocol_requires_new_unexposed_data: true
