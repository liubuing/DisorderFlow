# BFN Phase 3 — Cross-Chain Feature Fine-Tuning
#
# Fine-tunes the BFN model to learn antibody-antigen cross-chain interactions
# by training on ~40 antibody-antigen complexes with CDR co-design tasks.
#
# Key differences from Phase 1/2:
#   1. Phase3Dataset: antibody-antigen complexes with CDR masking
#   2. Unfreeze top 2 encoder layers (not just confidence heads)
#   3. Sequence + structure co-design with antigen context preserved
#   4. Lower LR (5e-6) to avoid catastrophic forgetting
#   5. Small batch size (1-2) due to complex size
#
# Prerequisites:
#   python scripts/preprocess_phase3_dataset.py
#
# Usage:
#   python train.py configs/train/bfn_phase3_xpu.yml \
#       --finetune ./logs/bfn_idp_phase2_xpu_2026_05_28__01_22_06/checkpoints/best.pt \
#       --device cuda --no_amp

model:
  type: antibody_bfn
  res_feat_dim: 256
  pair_feat_dim: 128
  diffusion:
    num_steps: 20
    beta: 1.0
    schedule: cosine
    eps_net_opt:
      num_layers: 6
  train_structure: true
  train_sequence: true
  ot_opt:
    num_iters: 5
  loss_weight:
    seq: 3.0
    dist: 0.5
    ang: 0.5
    plddt: 1.0
    iptm: 1.5
    pae: 0.3
    huber_beta: 0.1
    train_recycles: 2
    mask_aug_prob: 0.4
    mask_aug_ratio: [0.2, 0.8]

train:
  loss_weights:
    seq: 3.0
    dist: 0.5
    ang: 0.5
    plddt: 1.0
    iptm: 1.5
    pae: 0.3
  freeze_backbone: false
  unfreeze_encoder_layers: 2
  max_iters: 5000
  val_freq: 200
  log_freq: 10
  batch_size: 1
  warmup_steps: 200
  seed: 2029
  max_grad_norm: 1.0
  early_stopping_patience: 30
  optimizer:
    type: adamw
    lr: 5.e-6
    weight_decay: 1.0e-4
    beta1: 0.9
    beta2: 0.999
  scheduler:
    type: plateau
    factor: 0.5
    patience: 20
    min_lr: 1.e-7

dataset:
  train:
    type: phase3
    lmdb_path: ./data/phase3_processed/train.lmdb
    transform:
      - type: mask_multiple_cdrs  # Mask all CDRs for co-design
      - type: merge_chains
      - type: patch_around_anchor
  val:
    type: phase3
    lmdb_path: ./data/phase3_processed/val.lmdb
    transform:
      - type: mask_multiple_cdrs
      - type: merge_chains
      - type: patch_around_anchor
