# v5.1 Stage 3: joint CDR sequence, backbone geometry, and interface training.
model:
  type: antibody_bfn
  res_feat_dim: 256
  pair_feat_dim: 128
  diffusion:
    num_steps: 20
    beta: 1.0
    schedule: cosine
    eps_net_opt:
      num_layers: 6
      pair_routing: true
  train_structure: true
  train_sequence: true
  ot_opt:
    num_iters: 5
  loss_weight:
    seq: 1.0
    contact: 0.3
    contrastive: 0.0
    dist: 0.2
    fape: 0.15
    ang: 0.1
    disorder: 1.0
    train_recycles: 1
    mask_aug_prob: 0.2
    mask_aug_ratio: [0.1, 0.4]
    label_smoothing: 0.1
    encoder_dropout: 0.05
    t_clamp: 0.95

train:
  loss_weights:
    seq: 1.0
    contact: 0.3
    dist: 0.2
    fape: 0.15
    ang: 0.1
  freeze_backbone: false
  max_iters: 3500
  val_freq: 250
  log_freq: 10
  batch_size: 1
  warmup_steps: 250
  early_stopping_patience: 20
  seed: 2053
  max_grad_norm: 10.0
  ema_decay: 0.999
  optimizer:
    type: adamw
    lr: 5.e-6
    weight_decay: 1.e-4
    beta1: 0.9
    beta2: 0.999
  scheduler:
    type: plateau
    factor: 0.5
    patience: 12
    min_lr: 1.e-7

dataset:
  train:
    type: phase3
    lmdb_path: ./data/phase3_v5_1_pair_clustered/train.lmdb
    transform:
      - type: mask_multiple_cdrs
        selection: [H1, H2, H3, L1, L2, L3]
        augmentation: true
      - type: merge_chains
      - type: patch_around_anchor
  val:
    type: phase3
    lmdb_path: ./data/phase3_v5_1_pair_clustered/val.lmdb
    transform:
      - type: mask_multiple_cdrs
        selection: [H1, H2, H3, L1, L2, L3]
        augmentation: false
      - type: merge_chains
      - type: patch_around_anchor
