# BFN V17e: Direction E — antigen pooling + concat (lr=5e-4, 500 steps)
#
# Direction D (cross-attn + zero-init) proved gradient flows but probe
# showed Δ(complex-fixbb) still ~0 after 1500 steps. BFN seq loss cannot
# drive antigen-specific CDR learning through per-residue cross-attention.
#
# Direction E replaces cross-attention with simpler, stronger path:
# mean-pool antigen encoder features → concat to each CDR residue →
# Linear projection back to res_feat_dim. No learned attention, no gate.
# Zero-init projection preserves V15 at start.

model:
  type: antibody_bfn
  res_feat_dim: 256
  pair_feat_dim: 128
  diffusion:
    num_steps: 20
    beta: 1.0
    schedule: cosine
    eps_net_opt:
      num_layers: 6
  train_structure: true
  train_sequence: true
  ot_opt:
    num_iters: 5
  loss_weight:
    seq: 1.0
    dist: 0.0
    ang: 0.0
    plddt: 1.0
    iptm: 1.5
    pae: 0.3
    disorder: 0.3
    conf_variance: 0.50
    conf_ranking: 0.15
    grouped_margin: 0.30
    conf_anticollapse: 0.50
    huber_beta: 0.1
    train_recycles: 1
    mask_aug_prob: 0.2
    mask_aug_ratio: [0.2, 0.6]
    label_smoothing: 0.1
    encoder_dropout: 0.05

train:
  loss_weights:
    seq: 1.0
    dist: 0.0
    ang: 0.0
    plddt: 1.0
    iptm: 1.5
    pae: 0.3
    disorder: 0.3
    conf_variance: 0.50
    conf_ranking: 0.15
    grouped_margin: 0.30
    conf_anticollapse: 0.50
  freeze_backbone: false
  unfreeze_encoder_layers: 6
  max_iters: 500
  val_freq: 100
  log_freq: 10
  batch_size: 1
  warmup_steps: 50
  seed: 2034
  max_grad_norm: 5.0
  ema_decay: 0.999
  optimizer:
    type: adamw
    lr: 5.e-4
    weight_decay: 1.0e-4
    beta1: 0.9
    beta2: 0.999
  scheduler:
    type: plateau
    factor: 0.5
    patience: 10
    min_lr: 1.e-6

dataset:
  train:
    type: phase3
    lmdb_path: ./data/sabdab_phase3_processed/train.lmdb
    transform:
      - type: mask_multiple_cdrs
      - type: merge_chains
      - type: patch_around_anchor
  val:
    type: phase3
    lmdb_path: ./data/sabdab_phase3_processed/val.lmdb
    transform:
      - type: mask_multiple_cdrs
      - type: merge_chains
      - type: patch_around_anchor
