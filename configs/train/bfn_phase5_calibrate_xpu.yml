# BFN Phase 5 — Full Model Confidence Calibration (Unfrozen Backbone)
#
# Problem: Phase 3/4 froze the backbone → encoder outputs deterministic features
# for a given scaffold → confidence heads always see identical inputs → output constants
# (pLDDT=0.9643 ± 0.0000, ipTM=0.8700 ± 0.0000 across all designs).
#
# Strategy:
#   1. UNFREEZE backbone — encoder adapts features to distinguish designed sequences
#   2. Heavy mask augmentation (60%) — randomly mark residues as "generated" to
#      simulate design-time partial information; zero their pair features
#   3. 3 training recycles — fully train confidence feedback embeddings
#   4. Negative samples (30%) — scramble sequences on correct structures, label low
#   5. Lower LR (5e-6) — careful finetuning to preserve pretrained features
#   6. Zero structure losses → seq_only mode → receiver uses true backbone (correct
#      for confidence prediction)
#
# Start from Phase 3 v11 extended checkpoint (best encoder, full model trained).
# Uses confidence_regression dataset (real AF2 ground truth + disorder labels).
#
# Usage:
#   python train.py configs/train/bfn_phase5_calibrate_xpu.yml \
#       --finetune ./logs/bfn_phase3_v11_extended_2026_05_31__12_09_57/checkpoints/best.pt \
#       --device cuda --no_amp

model:
  type: antibody_bfn
  res_feat_dim: 256
  pair_feat_dim: 128
  diffusion:
    num_steps: 20
    beta: 1.0
    schedule: cosine
    eps_net_opt:
      num_layers: 6
  train_structure: true
  train_sequence: true
  ot_opt:
    num_iters: 5
  loss_weight:
    plddt: 2.0
    iptm: 2.5
    pae: 0.3
    disorder: 1.0
    head_dropout: 0.15
    encoder_dropout: 0.1
    huber_beta: 0.1
    train_recycles: 3
    mask_aug_prob: 0.6
    mask_aug_ratio: [0.3, 1.0]

train:
  loss_weights:
    plddt: 2.0
    iptm: 2.5
    pae: 0.3
    disorder: 1.0
  freeze_backbone: false  # CRITICAL: unfreeze all layers
  max_iters: 12000
  val_freq: 200
  log_freq: 20
  batch_size: 1
  warmup_steps: 500
  seed: 2029
  max_grad_norm: 1.0
  ema_decay: 0.999
  neg_sample_prob: 0.3
  neg_confidence:
    plddt: 0.1
    iptm: 0.05
    pae: 0.65
  neg_scramble_ratio: [0.2, 0.5]
  optimizer:
    type: adamw
    lr: 5.e-6
    weight_decay: 5.0e-4
    beta1: 0.9
    beta2: 0.999
  scheduler:
    type: plateau
    factor: 0.5
    patience: 30
    min_lr: 1.e-7

dataset:
  train:
    type: confidence_regression
    db_path: ./data/confidence_merged_v11/confidence_train.lmdb
    max_residues: 250
    idp_sample_weight: 1.5
  val:
    type: confidence_regression
    db_path: ./data/confidence_merged_v11/confidence_val.lmdb
    max_residues: 350
