# Candidate-interface confidence successor development checkpoint.
# Legacy V14 LMDBs are rejected by the dataset loader.

lineage:
  classification: development_only
  allowed_initializer_sha256: 9bc6d00a80ca07faaba2176a6b7cbdd48b24072b9640aab763c4ffe36867f2e7
  dataset_manifest_sha256: b1a000db65eef5e004d2e3f43e643975bd66cc2cdee8c289712d32c286a227bb

model:
  type: antibody_bfn
  confidence_head_kind: candidate_interface_v1
  res_feat_dim: 256
  pair_feat_dim: 128
  diffusion:
    num_steps: 20
    beta: 1.0
    schedule: cosine
    eps_net_opt:
      num_layers: 6
      pair_routing: true
  train_structure: true
  train_sequence: true
  ot_opt:
    num_iters: 5
  loss_weight:
    seq: 0.0
    dist: 0.0
    ang: 0.0
    plddt: 1.0
    iptm: 1.5
    pae: 0.5
    disorder: 0.0
    conf_variance: 1.0
    conf_ranking: 1.0
    grouped_margin: 1.0
    grouped_plddt_margin: 1.0
    grouped_pae_margin: 1.0
    conf_anticollapse: 1.0
    huber_beta: 0.1
    train_recycles: 1
    mask_aug_prob: 0.0
    encoder_dropout: 0.05

train:
  loss_weights:
    seq: 0.0
    dist: 0.0
    ang: 0.0
    plddt: 1.0
    iptm: 1.5
    pae: 0.5
    disorder: 0.0
    conf_variance: 0.05
    conf_ranking: 0.0
    conf_grouped_margin: 0.3
    conf_grouped_plddt_margin: 0.3
    conf_grouped_pae_margin: 0.3
    conf_anticollapse: 0.05
  freeze_backbone: true
  trainable_modules:
    - candidate_interface
  unfreeze_encoder_layers: 0
  fixed_t: 0.5
  val_fixed_t: 0.5
  max_iters: 1000
  val_freq: 100
  log_freq: 10
  batch_size: 4
  warmup_steps: 100
  seed: 2041
  max_grad_norm: 1.0
  ema_decay: 0.99
  optimizer:
    type: adamw
    lr: 1.e-4
    weight_decay: 1.0e-4
    beta1: 0.9
    beta2: 0.999
  scheduler:
    type: plateau
    factor: 0.5
    patience: 10
    min_lr: 1.e-7

dataset:
  train:
    type: confidence_regression
    db_path: ./data/confidence_candidate_interface_v1_grouped_unique/train.lmdb
    candidate_interface_v1: true
    max_residues: 384
  val:
    type: confidence_regression
    db_path: ./data/confidence_candidate_interface_v1_grouped_unique/val_scaffold_disjoint.lmdb
    candidate_interface_v1: true
    max_residues: 384
