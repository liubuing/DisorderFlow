# BFN V17h: Direction H — contrastive CDR-antigen matching (§2.2)
#
# Plan §6.1 diagnosis: seq recovery on SAbDab cannot teach antigen
# specificity because each (scaffold, antigen) has exactly one CDR.
# V17h adds a contrastive head + loss:
#   - 50% of batches: CDR shuffled within mask_gen → target=0 (fake)
#   - 50% of batches: real CDR → target=1 (real)
#   - Model learns to distinguish matching vs non-matching CDR-antigen pairs
#   - This forces antigen-compatible features into the encoder → benefits head_seq
#
# Resume from V17c best.pt (val 92.38, out_proj=2.13). The contrastive head
# is randomly initialised; all V17c weights preserved via strict=False.

model:
  type: antibody_bfn
  res_feat_dim: 256
  pair_feat_dim: 128
  diffusion:
    num_steps: 20
    beta: 1.0
    schedule: cosine
    eps_net_opt:
      num_layers: 6
  train_structure: true
  train_sequence: true
  ot_opt:
    num_iters: 5
  loss_weight:
    seq: 1.0
    dist: 0.0
    ang: 0.0
    contrastive: 0.5              # NEW: CDR-antigen matching BCE
    plddt: 1.0
    iptm: 1.5
    pae: 0.3
    disorder: 0.3
    conf_variance: 0.50
    conf_ranking: 0.15
    grouped_margin: 0.30
    conf_anticollapse: 0.50
    huber_beta: 0.1
    train_recycles: 1
    mask_aug_prob: 0.2
    mask_aug_ratio: [0.2, 0.6]
    label_smoothing: 0.1
    encoder_dropout: 0.05
    t_clamp: 0.95

train:
  loss_weights:
    seq: 1.0
    dist: 0.0
    ang: 0.0
    contrastive: 0.5
    plddt: 1.0
    iptm: 1.5
    pae: 0.3
    disorder: 0.3
    conf_variance: 0.50
    conf_ranking: 0.15
    grouped_margin: 0.30
    conf_anticollapse: 0.50
  freeze_backbone: false
  unfreeze_encoder_layers: 6
  max_iters: 4000               # resume from 2000, train 2000 more
  val_freq: 500
  log_freq: 10
  batch_size: 1
  warmup_steps: 100
  seed: 2037
  max_grad_norm: 1.0
  ema_decay: 0.999
  optimizer:
    type: adamw
    lr: 2.e-5
    weight_decay: 1.0e-4
    beta1: 0.9
    beta2: 0.999
  scheduler:
    type: plateau
    factor: 0.5
    patience: 20
    min_lr: 5.e-7

dataset:
  train:
    type: phase3
    lmdb_path: ./data/sabdab_phase3_processed/train.lmdb
    transform:
      - type: mask_multiple_cdrs
      - type: merge_chains
      - type: patch_around_anchor
  val:
    type: phase3
    lmdb_path: ./data/sabdab_phase3_processed/val.lmdb
    transform:
      - type: mask_multiple_cdrs
      - type: merge_chains
      - type: patch_around_anchor
