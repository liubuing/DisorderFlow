# BFN IDP-Aware Phase 2 — CUDA (RTX 5060 Laptop 8GB VRAM)
#
# Uses EBI MobiDB-lite per-residue disorder annotations (v10 LMDB).
# Falls back to AF2 pLDDT < 50 for unavailable entries.
#
# Key improvements over Phase 1:
#   1. Real per-residue disorder labels (74/139 IDP entries from EBI, 65 from AF2 pLDDT)
#   2. No more noisy entry-level is_idp broadcast
#   3. Anti-overfitting: weight_decay=1e-4, head_dropout=0.2, encoder fully frozen
#   4. Only confidence + disorder heads train (backbone locked)
#
# Memory: ~6-7 GB VRAM with batch_size=1, max_residues=250
#
# Usage (train from Phase 1 checkpoint):
#   python train.py configs/train/bfn_idp_phase2_cuda.yml \
#       --finetune ./logs/bfn_idp_phase1_xpu_2026_05_27__22_30_06/checkpoints/best.pt \
#       --device cuda
#
# Usage (resume from Phase 2 CUDA checkpoint):
#   python train.py configs/train/bfn_idp_phase2_cuda.yml \
#       --resume ./logs/<run_dir>/checkpoints/<iter>.pt \
#       --device cuda

model:
  type: antibody_bfn
  res_feat_dim: 256
  pair_feat_dim: 128
  diffusion:
    num_steps: 20
    beta: 1.0
    schedule: cosine
    eps_net_opt:
      num_layers: 6
  train_structure: true
  train_sequence: true
  ot_opt:
    num_iters: 5
  loss_weight:
    plddt: 2.0
    iptm: 2.5
    pae: 0.3
    disorder: 1.0
    head_dropout: 0.2
    huber_beta: 0.1
    train_recycles: 3
    mask_aug_prob: 0.6
    mask_aug_ratio: [0.3, 1.0]

train:
  loss_weights:
    plddt: 2.0
    iptm: 2.5
    pae: 0.3
    disorder: 1.0
  freeze_backbone: true
  unfreeze_encoder_layers: 0
  max_iters: 50000
  val_freq: 100
  log_freq: 20
  batch_size: 1
  warmup_steps: 2000
  seed: 2029
  max_grad_norm: 1.0
  early_stopping_patience: 50
  idp_loss_multiplier: 1.0
  length_curriculum:
    stages:
      - [0, 250]
      - [10000, 350]
      - [20000, 500]
  optimizer:
    type: adam
    lr: 5.e-5
    weight_decay: 1.0e-4
    beta1: 0.9
    beta2: 0.999
  scheduler:
    type: cosine
    T_0: 5000
    T_mult: 2
    eta_min: 1.e-6

dataset:
  train:
    type: confidence_regression
    db_path: ./data/confidence_merged_v10/confidence_train.lmdb
    max_residues: 250
    idp_sample_weight: 2.5
    min_af2_plddt: 40.0
  val:
    type: confidence_regression
    db_path: ./data/confidence_merged_v10/confidence_val.lmdb
    max_residues: 350
