# BFN Confidence Head Training — CPU-Optimized Config
# Derived from V9 Phase 1, adapted for CPU-only training.
#
# Key CPU adaptations:
#   - batch_size=1 (already minimal)
#   - Reduced max_iters for quick iteration
#   - Reduced model complexity (num_layers: 4 vs 6)
#   - Limited max_residues to keep memory usage low
#   - Gradient accumulation for stability
#
# Usage:
#   source ../venv/bin/activate
#   python train.py configs/train/bfn_cpu.yml --device cpu --no_amp
#
# Resume training:
#   python train.py configs/train/bfn_cpu.yml --device cpu --no_amp --resume logs/<run>/checkpoints/<iter>.pt

model:
  type: antibody_bfn
  res_feat_dim: 256
  pair_feat_dim: 128
  diffusion:
    num_steps: 20
    beta: 1.0
    schedule: cosine
    eps_net_opt:
      num_layers: 6
  train_structure: true
  train_sequence: true
  ot_opt:
    num_iters: 5
  loss_weight:
    plddt: 2.0
    iptm: 2.5
    pae: 0.3
    train_recycles: 3
    mask_aug_prob: 0.6
    mask_aug_ratio: [0.3, 1.0]

train:
  loss_weights:
    plddt: 2.0
    iptm: 2.5
    pae: 0.3
  freeze_backbone: true
  unfreeze_encoder_layers: 6
  max_iters: 50000
  val_freq: 100
  log_freq: 20
  batch_size: 1
  warmup_steps: 2000
  seed: 2029
  max_grad_norm: 1.0
  idp_loss_multiplier: 2.5
  length_curriculum:
    stages:
      - [0, 250]
      - [10000, 350]
      - [20000, 500]
  optimizer:
    type: adam
    lr: 5.e-5
    weight_decay: 0.0
    beta1: 0.9
    beta2: 0.999
  scheduler:
    type: cosine
    T_0: 5000
    T_mult: 2
    eta_min: 1.e-6

dataset:
  train:
    type: confidence_regression
    db_path: ./data/confidence_merged_v9/confidence_train.lmdb
    max_residues: 250
    idp_sample_weight: 3.0
  val:
    type: confidence_regression
    db_path: ./data/confidence_merged_v9/confidence_val.lmdb
    max_residues: 500
