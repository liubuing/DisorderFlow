# BFN Phase 4 — Expanded Antibody-Antigen Cross-Chain Training
#
# Key improvements over Phase 3:
#   1. Expanded dataset (SAbDab + original complexes, 200+ entries)
#   2. Anti-overfitting: encoder_dropout, label_smoothing, EMA, stronger weight_decay
#   3. Reduced unfreeze_encoder_layers (1 vs 2)
#   4. Lower LR (3e-6) with more patience
#
# Prerequisites:
#   1. python scripts/download_sabdab.py
#   2. python scripts/preprocess_sabdab_phase3.py
#   3. python scripts/validate_sabdab_complexes.py
#   4. python scripts/merge_phase3_datasets.py
#
# Usage:
#   python train.py configs/train/bfn_phase4_xpu.yml \
#       --finetune <phase2_or_phase3_checkpoint> \
#       --device cuda --no_amp

model:
  type: antibody_bfn
  res_feat_dim: 256
  pair_feat_dim: 128
  diffusion:
    num_steps: 20
    beta: 1.0
    schedule: cosine
    eps_net_opt:
      num_layers: 6
  train_structure: true
  train_sequence: true
  ot_opt:
    num_iters: 5
  loss_weight:
    seq: 3.0
    dist: 0.5
    ang: 0.5
    plddt: 1.0
    iptm: 1.5
    pae: 0.3
    huber_beta: 0.1
    train_recycles: 2
    mask_aug_prob: 0.4
    mask_aug_ratio: [0.2, 0.8]
    head_dropout: 0.2
    encoder_dropout: 0.15
    label_smoothing: 0.1

train:
  loss_weights:
    seq: 3.0
    dist: 0.5
    ang: 0.5
    plddt: 1.0
    iptm: 1.5
    pae: 0.3
  freeze_backbone: false
  unfreeze_encoder_layers: 1
  max_iters: 10000
  val_freq: 200
  log_freq: 10
  batch_size: 1
  warmup_steps: 200
  seed: 2029
  max_grad_norm: 1.0
  early_stopping_patience: 30
  ema_decay: 0.999
  optimizer:
    type: adamw
    lr: 3.e-6
    weight_decay: 1.0e-3
    beta1: 0.9
    beta2: 0.999
  scheduler:
    type: plateau
    factor: 0.5
    patience: 25
    min_lr: 1.e-7

dataset:
  train:
    type: phase3
    lmdb_path: ./data/phase3_expanded/train.lmdb
    transform:
      - type: mask_multiple_cdrs
      - type: merge_chains
      - type: patch_around_anchor
  val:
    type: phase3
    lmdb_path: ./data/phase3_expanded/val.lmdb
    transform:
      - type: mask_multiple_cdrs
      - type: merge_chains
      - type: patch_around_anchor
