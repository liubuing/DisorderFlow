# BFN Confidence Head Training V10 Phase 1
# Architecture: Deeper residual heads + attention PAE
# Anti-overfitting: Dropout, weight decay, early stopping
# Robust losses: Huber (pLDDT, ipTM, PAE) instead of MSE
#
# Key changes vs V9:
#   1. ResidualMLP confidence heads (residual + LayerNorm + Dropout)
#   2. AttentionPAEHead (4-head attention with pair bias)
#   3. Huber loss (beta=0.1) for all confidence targets
#   4. Per-residue pLDDT confidence weighting
#   5. AdamW optimizer with weight_decay=1e-4
#   6. Early stopping (patience=50 validations)
#   7. Quality filter: min mean AF2 pLDDT >= 40
#   8. Reduced IDP bias (multiplier 2.0, sample_weight 2.5)
#   9. More frequent cosine restarts (T_0=4000)
#
# Finetuning from V9:
#   python train.py configs/train/bfn_confidence_combined_v10_phase1.yml \
#     --finetune ./logs/bfn_confidence_combined_v9_phase1_.../checkpoints/best.pt \
#     --device cpu --no_amp
#
# Fresh training:
#   python train.py configs/train/bfn_confidence_combined_v10_phase1.yml \
#     --device cpu --no_amp

model:
  type: antibody_bfn
  res_feat_dim: 256
  pair_feat_dim: 128
  diffusion:
    num_steps: 20
    beta: 1.0
    schedule: cosine
    eps_net_opt:
      num_layers: 6
  train_structure: true
  train_sequence: true
  ot_opt:
    num_iters: 5
  loss_weight:
    plddt: 2.0
    iptm: 2.5
    pae: 0.3
    train_recycles: 3
    mask_aug_prob: 0.6
    mask_aug_ratio: [0.3, 1.0]
    head_dropout: 0.1
    huber_beta: 0.1

train:
  loss_weights:
    plddt: 2.0
    iptm: 2.5
    pae: 0.3
  freeze_backbone: true
  unfreeze_encoder_layers: 6
  max_iters: 50000
  val_freq: 100
  log_freq: 20
  batch_size: 1
  warmup_steps: 2000
  seed: 2029
  max_grad_norm: 1.0
  # Anti-overfitting
  early_stopping_patience: 50
  idp_loss_multiplier: 2.0
  # Length curriculum
  length_curriculum:
    stages:
      - [0, 250]
      - [10000, 350]
      - [20000, 500]
  optimizer:
    type: adamw
    lr: 5.e-5
    weight_decay: 1.e-4
    beta1: 0.9
    beta2: 0.999
  scheduler:
    type: cosine
    T_0: 4000
    T_mult: 2
    eta_min: 1.e-6

dataset:
  train:
    type: confidence_regression
    db_path: ./data/confidence_merged_v9/confidence_train.lmdb
    max_residues: 250
    idp_sample_weight: 2.5
    min_af2_plddt: 40.0
  val:
    type: confidence_regression
    db_path: ./data/confidence_merged_v9/confidence_val.lmdb
    max_residues: 500
