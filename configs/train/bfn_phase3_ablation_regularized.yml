# BFN Phase 3 Ablation — Regularized
#
# All anti-overfitting techniques enabled:
#   1. encoder_dropout: 0.1 (new dropout in GAEncoder blocks)
#   2. label_smoothing: 0.1 (softens sequence CE targets)
#   3. weight_decay: 1e-3 (10x stronger L2 penalty)
#   4. ema_decay: 0.999 (exponential moving average for val)
#   5. unfreeze_encoder_layers: 1 (reduced from 2)
#   6. lr: 3e-6 (slightly lower)
#
# Compares against baseline to measure anti-overfitting impact.
#
# Usage:
#   python train.py configs/train/bfn_phase3_ablation_regularized.yml \
#       --finetune ./logs/bfn_idp_phase2_xpu_2026_05_28__01_22_06/checkpoints/best.pt \
#       --device cuda --no_amp

model:
  type: antibody_bfn
  res_feat_dim: 256
  pair_feat_dim: 128
  diffusion:
    num_steps: 20
    beta: 1.0
    schedule: cosine
    eps_net_opt:
      num_layers: 6
  train_structure: true
  train_sequence: true
  ot_opt:
    num_iters: 5
  loss_weight:
    seq: 3.0
    dist: 0.5
    ang: 0.5
    plddt: 1.0
    iptm: 1.5
    pae: 0.3
    huber_beta: 0.1
    train_recycles: 2
    mask_aug_prob: 0.4
    mask_aug_ratio: [0.2, 0.8]
    head_dropout: 0.2
    encoder_dropout: 0.1
    label_smoothing: 0.1

train:
  loss_weights:
    seq: 3.0
    dist: 0.5
    ang: 0.5
    plddt: 1.0
    iptm: 1.5
    pae: 0.3
  freeze_backbone: false
  unfreeze_encoder_layers: 1
  max_iters: 2000
  val_freq: 200
  log_freq: 10
  batch_size: 1
  warmup_steps: 200
  seed: 2029
  max_grad_norm: 1.0
  ema_decay: 0.999
  optimizer:
    type: adamw
    lr: 3.e-6
    weight_decay: 1.0e-3
    beta1: 0.9
    beta2: 0.999
  scheduler:
    type: plateau
    factor: 0.5
    patience: 25
    min_lr: 1.e-7

dataset:
  train:
    type: phase3
    lmdb_path: ./data/phase3_processed/train.lmdb
    transform:
      - type: mask_multiple_cdrs
      - type: merge_chains
      - type: patch_around_anchor
  val:
    type: phase3
    lmdb_path: ./data/phase3_processed/val.lmdb
    transform:
      - type: mask_multiple_cdrs
      - type: merge_chains
      - type: patch_around_anchor
